name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: Tests without a database
        run: |
          bad=0
          for t in test/*_test.dart; do
            if ! timeout -k 10 300 dart run "$t" > t.log 2>&1 || grep -qE "NOT PASSED|Unhandled exception" t.log; then
              bad=$((bad+1)); echo "FAIL $t"; tail -20 t.log
            fi
          done
          exit $bad
      # Starts its own PostgreSQL (pinned @embedded-postgres binaries) and redis-server on private ports.
      - name: Tests on PostgreSQL and Redis
        run: tool/pg_test.sh

  # Secrets in the pushed / PR commits and known advisories in pubspec.lock; exceptions: SECURITY.md, "CI scans".
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=pubspec.lock
