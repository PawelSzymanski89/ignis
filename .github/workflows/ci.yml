name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: Tests without a database
        run: |
          bad=0
          for t in test/*_test.dart; do
            if ! timeout -k 10 300 dart run "$t" > t.log 2>&1 || grep -qE "NOT PASSED|Unhandled exception" t.log; then
              bad=$((bad+1)); echo "FAIL $t"; tail -20 t.log
            fi
          done
          exit $bad
      # Starts its own PostgreSQL (pinned @embedded-postgres binaries) and redis-server on private ports.
      - name: Tests on PostgreSQL and Redis
        run: tool/pg_test.sh
