name: ignis_builder
description: >-
  build_runner builder for Ignis Web Engine — generates lib/ignis_registry.g.dart (entities, pages,
  actions, synced fields) so the engine runs without dart:mirrors (AOT, dart compile exe).
publish_to: none
version: 0.3.0
repository: https://github.com/PawelSzymanski89/ignis

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: any
  build: any
  glob: any
  source_gen: any
