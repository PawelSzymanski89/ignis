name: ignis_builder
description: >-
  build_runner builder for Ignis Web Engine — generates lib/ignis_registry.g.dart (entities, pages,
  actions, synced fields) the engine needs (JIT and AOT, dart compile exe).
publish_to: none
version: 0.3.0
repository: https://github.com/PawelSzymanski89/ignis

environment:
  sdk: ^3.11.0

# Versions follow source_gen (which pins analyzer and build); ignis is not a dependency — the builder
# matches the annotations by library URI (package:ignis/engine/annotations.dart).
dependencies:
  analyzer: any
  build: any
  # sha256 of the lib/ sources → the staleness fingerprint written into the generated registry.
  crypto: any
  dart_style: any
  glob: any
  source_gen: any
