name: ignis
description: >-
  Ignis Web Engine — a multi-domain CMS library (one installation, many services on their own
  domains): an annotation-driven page and entity engine plus an admin panel.
  Pages and entities come from a registry generated by the package's own builder (build_runner) — runs
  under `dart run` and as an AOT binary (`dart compile exe`).
publish_to: none
version: 0.5.3
repository: https://github.com/PawelSzymanski89/ignis
homepage: https://github.com/PawelSzymanski89/ignis

environment:
  # ^3.11: the registry builder (lib/builder.dart; analyzer, source_gen) is part of the package.
  sdk: ^3.11.0

dependencies:
  # Templates: Jinja ({% extends %}/{% block %}/{% macro %}), no autoescape — Renderer escapes (engine/render.dart).
  # Not Mustache: no template inheritance, and the panel shell must live in ONE layout.
  # 0.6.x because 0.7 requires Dart >= 3.12.
  jinja: ^0.7.2
  # PostgreSQL driver.
  postgres: ^3.6.0
  # Password hashing: slow, salted bcrypt (brute-force resistant). Pure Dart.
  bcrypt: ^1.1.3
  # sha256 for tokens and fingerprints (not for passwords).
  crypto: ^3.0.8
  # MinIO/S3 client — file storage.
  minio: ^3.5.8
  # multipart/form-data parser (file uploads). Dart team package.
  mime: ^2.1.0
  # IANA time zones (schedules in a project's / recipient's zone) — tzdata bundled, pure Dart.
  timezone: ^0.11.2
  # Redis client — sessions and caches shared by every node.
  redis: ^4.0.0
  # AES-GCM for secrets in the settings table (engine/crypto.dart). Already pulled in by minio;
  # listed because it is used directly.
  pointycastle: ^4.0.0
  # Registry builder (package:ignis/builder.dart, build.yaml) — build time only: package:ignis/ignis.dart
  # does not import them, so they are not in the AOT binary.
  analyzer: ^14.7.0
  build: ^5.0.0
  dart_style: ^3.1.14
  glob: ^2.2.0
  source_gen: ^4.3.1

dev_dependencies:
  # Runs the package's own builder (build.yaml) → lib/ignis_registry.g.dart — build time only.
  build_runner: ^2.4.0
