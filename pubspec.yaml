name: ignis
description: >-
  Ignis Web Engine — a multi-domain CMS library (one installation, many services on their own
  domains): an annotation-driven page and entity engine plus an admin panel.
  Pages and entities come from a registry generated by the package's own builder (build_runner) — runs
  under `dart run` and as an AOT binary (`dart compile exe`).
publish_to: none
version: 0.3.0
repository: https://github.com/PawelSzymanski89/ignis
homepage: https://github.com/PawelSzymanski89/ignis

environment:
  # Rejestr stron/encji generuje builder pakietu (lib/builder.dart, build_runner) — działa w JIT i AOT.
  # ^3.11: builder (analyzer/source_gen) jest teraz częścią pakietu.
  sdk: ^3.11.0

dependencies:
  # Silnik szablonów — Jinja: {% extends %}/{% block %}/{% macro %}. Bez autoescape — escapuje Renderer (engine/render.dart).
  # Mustache odrzucony: brak dziedziczenia szablonów, a powłoka panelu musi siedzieć
  # w JEDNYM layoucie. 0.6.7, bo 0.7 wymaga Dart >=3.12.
  jinja: ^0.6.7
  # Sterownik Postgresa (relacyjna baza — login sprawdza usera w tabeli users).
  postgres: ^3.0.0
  # bcrypt — WOLNY, solony hash haseł (anty-brute-force). Pure Dart, bez codegenu.
  bcrypt: ^1.1.3
  # crypto: sha256 do tokenów/pomocniczo (nie do haseł).
  crypto: ^3.0.0
  # Klient MinIO/S3 — magazyn plików CMS-a.
  minio: ^3.5.8
  # Parser multipart/form-data (upload plików). Pakiet zespołu Darta, bez codegenu.
  mime: ^2.0.0
  # Strefy IANA (harmonogramy w strefie projektu / odbiorcy) — baza tzdata w pakiecie, pure Dart.
  timezone: ^0.10.1
  # Klient Redis — sesje wspólne dla wszystkich instancji.
  redis: ^4.0.0
  # AES-GCM dla sekretów w tabeli settings (engine/crypto.dart). Już był w drzewie
  # zależności (minio), tu jawnie, bo używamy go bezpośrednio.
  pointycastle: ^4.0.0
  # Builder rejestru (package:ignis/builder.dart, build.yaml) — tylko czas budowania; runtime
  # (package:ignis/ignis.dart) ich nie importuje, więc nie trafiają do binarki AOT.
  analyzer: any
  build: any
  dart_style: any
  glob: any
  source_gen: any

dev_dependencies:
  # Runs the package's own builder (build.yaml) → lib/ignis_registry.g.dart — build time only.
  build_runner: ^2.4.0
